<div
  class="flex flex-col w-full justify-center items-center px-[50vh] pt-40 text-start"
>
  <mat-icon class="w-20 h-20" svgIcon="uil:success"></mat-icon>
  <span class="text-xl pt-6">Pagamento efetuado com sucesso!</span>
  <p class="text-md">
    O seu plano foi ativado com sucesso.
    <br />
    <span class="text-md font-bold"
      >Agora você pode visitar o menu "páginas".</span
    >
  </p>
  <p class="pt-8 w-full">
    <span>Plano ativado: </span>
    <br />
    <span class="font-bold">{{ plan }}</span>
  </p>

  <button mat-raised-button color="primary" class="mt-8" (click)="goToPages()">
    <span>Ir para páginas</span>
  </button>
</div>
